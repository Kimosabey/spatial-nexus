services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/spatialdevpassword
    volumes:
      - sn_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  api:
    build: .
    ports:
      - "8103:8103"
    environment:
      PORT: "8103"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: spatialdevpassword
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  sn_neo4jdata:
