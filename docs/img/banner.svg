<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="SpatialNexus — Topology Atlas">
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#faf9f4"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="bp" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 0 L0 80 M80 0 L80 80 M0 0 L80 0 M0 80 L80 80" stroke="rgba(30,58,138,0.1)" stroke-width="1"/>
      <path d="M0 16 L80 16 M0 32 L80 32 M0 48 L80 48 M0 64 L80 64" stroke="rgba(30,58,138,0.04)" stroke-width="1"/>
      <path d="M16 0 L16 80 M32 0 L32 80 M48 0 L48 80 M64 0 L64 80" stroke="rgba(30,58,138,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#paper)"/>
  <rect width="1200" height="320" fill="url(#bp)"/>
  <!-- Compass rose -->
  <g transform="translate(160 160)" opacity="0.9">
    <circle r="110" fill="#ffffff" stroke="#1e3a8a" stroke-width="0.7"/>
    <circle r="86"  fill="none"    stroke="#1e3a8a" stroke-width="0.4"/>
    <g stroke="#1e3a8a" stroke-width="1.4">
      <line x1="0" y1="-110" x2="0" y2="110"/>
      <line x1="-110" y1="0" x2="110" y2="0"/>
    </g>
    <g stroke="#1e3a8a" stroke-width="0.6">
      <line x1="-78" y1="-78" x2="78" y2="78"/>
      <line x1="-78" y1="78" x2="78" y2="-78"/>
    </g>
    <text y="-92" text-anchor="middle" font-family="DM Serif Display,serif" font-size="16" fill="#1e3a8a">N</text>
  </g>
  <!-- Isometric graph -->
  <g transform="translate(910 80)" opacity="0.9">
    <g stroke="#1e3a8a" stroke-width="1.2" fill="none">
      <line x1="40" y1="60"  x2="140" y2="40"/>
      <line x1="140" y1="40" x2="180" y2="120"/>
      <line x1="40" y1="60"  x2="90"  y2="140"/>
      <line x1="90" y1="140" x2="180" y2="120"/>
      <line x1="180" y1="120" x2="240" y2="160"/>
    </g>
    <g fill="#65a30d">
      <circle cx="40" cy="60" r="6"/>
      <circle cx="140" cy="40" r="7"/>
      <circle cx="180" cy="120" r="6"/>
      <circle cx="90" cy="140" r="6"/>
      <circle cx="240" cy="160" r="5"/>
    </g>
  </g>
  <!-- Brand -->
  <g transform="translate(310 110)">
    <text font-family="IBM Plex Mono,monospace" font-size="13" font-weight="700" fill="#3f6212" letter-spacing="6">SELFAWARE — ATLAS III</text>
    <text y="74" font-family="DM Serif Display,serif" font-size="78" fill="#1e3a8a" letter-spacing="-1">SpatialNexus</text>
    <text y="120" font-family="Inter,sans-serif" font-size="22" fill="#1e293b">Neo4j topology · downstream impact · subgraph explorer</text>
    <text y="156" font-family="IBM Plex Mono,monospace" font-size="14" fill="#3f6212" letter-spacing="2">:8103  ·  Cypher  ·  React Flow  ·  WCAG-AA</text>
  </g>
</svg>
